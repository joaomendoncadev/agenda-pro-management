spring:
  application:
    name: agenda-pro-management
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/agenda_pro}
    username: ${DATABASE_USERNAME:agenda_pro}
    password: ${DATABASE_PASSWORD:agenda_pro}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.joaomendonca.agendapro: INFO
