spring:
  datasource:
    url: jdbc:h2:mem:agenda_pro;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

agenda-pro:
  security:
    issuer: agenda-pro-test
    secret: test-secret-with-more-than-thirty-two-characters
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    bootstrap-key: test-bootstrap-key
