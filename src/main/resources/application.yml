spring:
  application:
    name: agenda-pro-management
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/agenda_pro}
    username: ${DATABASE_USERNAME:agenda_pro}
    password: ${DATABASE_PASSWORD:agenda_pro}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

agenda-pro:
  security:
    issuer: ${JWT_ISSUER:agenda-pro-management}
    secret: ${JWT_SECRET:local-development-secret-change-me-1234567890}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    bootstrap-key: ${BOOTSTRAP_KEY:agenda-pro-local-bootstrap}
